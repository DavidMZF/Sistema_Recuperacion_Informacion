services:
  - type: web
    name: ri-fiqa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python descargar_modelo.py
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 180 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FASTEMBED_CACHE
        value: modelo_cache
